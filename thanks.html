<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Thanks | Global SOC</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f7f9;--ink:#101a24;--muted:#5d6b78;--brand:#0e4d6e;--on:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#0b1015;--ink:#e9eff4;--muted:#95a3af;--brand:#5fb3dd;--on:#06202d;color-scheme:dark}}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;text-align:center;padding:16px}
h1{font-size:34px;letter-spacing:-.02em;margin:16px 0 8px}
p{color:var(--muted);max-width:420px;margin:0 auto}
a{display:inline-block;margin-top:24px;background:var(--brand);color:var(--on);text-decoration:none;font-weight:700;padding:12px 20px;border-radius:12px}
.ok{width:64px;height:64px;border-radius:50%;background:#1f8a5b;color:#fff;display:grid;place-items:center;font-size:30px;margin:0 auto}
</style>
</head>
<body>
<main><div class="ok">✓</div><h1>Thanks, we got it</h1><p>We'll reply within one business day to set up your free idea call.</p><a href="/">Back to Global SOC</a></main>
<script src="https://globalsoc.com.au/v.js" defer></script>
</body>
</html>
